name: Deploy n8n

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment: development or production'
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      image_tag:
        description: 'n8n Docker image tag (leave blank for the pinned default 2.48.6)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: n8n-deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env for compose validation
        run: cp .env.example .env

      - name: Lint Compose file
        run: docker compose config --quiet

      - name: Validate environment variables
        run: ./scripts/validate-env.sh .env

      - name: Ensure image is pinned
        run: |
          if grep -qE 'image:.*:latest' compose.yaml; then
            echo "ERROR: Image tag 'latest' found in compose.yaml — pin a specific version."
            exit 1
          fi

      - name: Verify pinned image digest
        run: |
          docker buildx imagetools inspect "docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG}"

      - name: Run secret scan
        run: bash scripts/check-secrets.sh

  deploy-development:
    name: Deploy to development
    needs: validate
    runs-on: ubuntu-latest
    if: |
      ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development') }}
    environment:
      name: development
      url: ${{ vars.N8N_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to development
        env:
          TARGET_ENV: development
        run: ./scripts/deploy-from-ci.sh development

      - name: Health check
        run: ./scripts/healthcheck.sh
        env:
          N8N_PUBLIC_URL: ${{ vars.N8N_PUBLIC_URL }}

  deploy-production:
    name: Deploy to production
    needs: validate
    runs-on: ubuntu-latest
    if: |
      ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    environment:
      name: production
      url: ${{ vars.N8N_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          TARGET_ENV: production
        run: ./scripts/deploy-from-ci.sh production

      - name: Health check
        run: ./scripts/healthcheck.sh
        env:
          N8N_PUBLIC_URL: ${{ vars.N8N_PUBLIC_URL }}