version: 2
updates:
  # Enable Docker image version updates for the n8n compose file
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 1
    closed-pull-requests-limit: 1
    # Latest n8n stable version; PRs will propose bumping the tag in compose.yaml
    # current version is 2.48.6 per compose.yaml
    restart-current: false
    # Allow auto-merging for non-security updates (optional)
    # reviewers: []
    # labels: []
    # assignees: []