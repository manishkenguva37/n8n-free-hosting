name: n8n-free-hosting

networks:
  n8n:
    driver: bridge

volumes:
  n8n_data:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-2.48.6}
    container_name: n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - N8N_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - n8n
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.9.1-alpine
    container_name: caddy
    profiles:
      - tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN:-}
    networks:
      - n8n